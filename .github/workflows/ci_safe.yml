name: CI_safe
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest    
      - run: pytest -v --junitxml=report.xml
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.xml
           
