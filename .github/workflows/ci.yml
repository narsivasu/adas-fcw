name: CI
on: 
   push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: pip install pytest 
      - run: pytest -v
  build:
    needs : test
    runs-on: ubuntu-latest
    env :
        APP_NAME: adas-fcw
        APP_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building the $APP_NAME app version $APP_VERSION"
      - name : use secret
        env :
             TOKEN: ${{ secrets.MY_TOKEN }}
        run : |
             echo "Token length: ${#TOKEN}"
             echo "Token is $TOKEN"
