name: CI
on:
  push:
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4
      - name: Create package
        run: zip adas-fcw-$APP_VERSION.zip fcw.py
      - name: Save package
        uses: actions/upload-artifact@v4
        with:
          name: adas-fcw-package
          path: adas-fcw-1.0.zip
          retention-days: 5
      - name: Write summary
        run: echo "Built version $APP_VERSION" >> $GITHUB_STEP_SUMMARY
               
   

