name: CI
on:
   workflow_dispatch:
jobs :
   test :
       runs-on: ubuntu-latest
       steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-python@v5
         with:
            python-version: "3.12"
       - run: pip install pytest
       - run: pytest
   build:
        runs-on: ubuntu-latest
        needs: test
        if: github.ref == 'refs/heads/narsivasu-patch-1'
        steps:
         - run : echo "test is completed"
               
   

